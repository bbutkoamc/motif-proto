# Buf CI/CD, following https://buf.build/docs/bsr/ci-cd/github-actions/
#
# bufbuild/buf-action runs the right checks per event automatically:
#   - pull_request: build, lint, format, and breaking-change detection
#     (against the PR base branch), with results posted as annotations and a
#     summary comment. The `buf skip breaking` PR label opts out of breaking.
#   - push to main: publishes named modules to the BSR (buf push), tagged with
#     git metadata. Scoped to main so only merged changes are published.
#   - delete: archives the BSR label for the deleted branch/tag.
#
# Requires a BUF_TOKEN repository secret (Settings > Secrets and variables >
# Actions) for the push and label-archive steps.
name: Buf CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}

  bhom-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          python3 tools/bhom_proto_generator.py check-committed
          --fetch-locked
          --entry Structure_oM/Elements/Bar.json
          --lock tools/bhom/schema.lock.json
          --catalog tools/bhom/projection_catalog.json
          --registry-root proto

  bhom-floor-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          schema_root="$(mktemp -d)"
          trap 'rm -rf "$schema_root"' EXIT
          python3 tools/bhom_proto_generator.py fetch-locked \
            --lock tools/bhom/schema.lock.json \
            --schema-root "$schema_root"
          python3 tools/bhom_proto_generator.py check \
            --schema-root "$schema_root" \
            --entry Physical_oM/Elements/Floor.json \
            --lock tools/bhom/schema.lock.json \
            --catalog tools/bhom/projection_catalog.json
