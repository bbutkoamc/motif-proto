syntax = "proto3";

package motif.extension.v1;

import "buf/validate/validate.proto";

// A reference to a single target entity.
//
// A relationship type carries one or more EntityReference fields as its
// endpoints (identified structurally by type). If those entities resolve against
// an external model rather than the relationship's own, the relationship also
// carries a single ModelReference.
message EntityReference {
  // The target entity's ID, a 16-byte UUID. Required.
  bytes entity_id = 1 [(buf.validate.field).bytes.len = 16];
}

// A reference to a specific version of a model.
//
// A relationship without a ModelReference is resolved against the model
// containing the relationship. A relationship can have at most one
// ModelReference, and if present, the relationship is resolved against
// the referenced model and version.
message ModelReference {
  // The model ID, a 16-byte UUID. Required.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The model version. Required.
  int32 model_version = 2 [(buf.validate.field).int32.gt = 0];
}
