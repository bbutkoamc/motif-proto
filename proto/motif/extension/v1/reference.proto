syntax = "proto3";

package motif.extension.v1;

import "buf/validate/validate.proto";

// A reference to a single target entity.
//
// If the relationship contains a ModelReference, the referenced entity is
// resolved against that model and version. If there is no ModelReference in
// the relationship, the entity is in the model containing this reference.
message EntityReference {
  // The target entity's ID, a 16-byte UUID. Required.
  bytes entity_id = 1 [(buf.validate.field).bytes.len = 16];
}

// A reference to a specific version of a model.
//
// A relationship can have at most one ModelReference, and if present, any
// entity references are resolved against the referenced model and version.
// If no entity references are present on the relationship, the reference
// is to the referenced model itself (at the specified version).
message ModelReference {
  // The model ID, a 16-byte UUID. Required.
  bytes model_id = 1 [(buf.validate.field).bytes.len = 16];

  // The model version. Required.
  int32 model_version = 2 [(buf.validate.field).int32.gt = 0];
}
