syntax = "proto3";

// Components and behaviors whose schemas are not yet finalized or are otherwise
// temporary. Expect churn here; types may be promoted to a stable package or
// removed.
package motif.data.temporary.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/data/style/v1/style.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";
import "motif/extension/v1/type.proto";

// A marker component which, for the March demo, allows an entity to act like a
// model.
message MockModel {
  option (motif.extension.v1.message).component = 39;
}

// Marks a parametric asset as a built-in (Motif-defined) asset assembly: a
// marker the asset materializer keys on to expand a placed instance into baked
// geometry. The assembly's part recipe is carried as data in a sibling
// `BuiltinAssetConfiguration` component (evaluated against the instance's
// resolved parameters). Distinct from future user-defined assets, which carry
// no built-in marker.
message BuiltinAssetAssembly {
  option (motif.extension.v1.message).component = 106;
}

// An in-development component which informs the change-propagation server to
// construct a rectangular prism by converting width and height into a vertical
// rectangular profile swept along a curve.
message SweepWidthHeightAlongCurveBehavior {
  option (motif.extension.v1.message).component = 63;
}

// A component which defines a set of exposed parameters.
//
// Generally added to parametric asset entities whose children wire the values
// into behaviors.
message ParameterDeclarations {
  option (motif.extension.v1.message).component = 89;

  // The declared parameters, keyed by parameter name.
  map<string, ParameterDeclaration> declarations = 1;
}

// The definition of a single parameter.
//
// `expected_type` is the declared payload type the corresponding
// `ResolvedParameters` entry must carry. Behaviors that consume the resolved
// value declare a `data_reference_expected_type` matching the same `TypeSpec`.
message ParameterDeclaration {
  // The parameter name.
  string name = 1;
  // A human-readable description of the parameter.
  string description = 2;
  // The declared payload type for this parameter.
  motif.extension.v1.TypeSpec expected_type = 3;

  // Optional default literal for hive/UI/placement authoring (meters for
  // TYPE_DOUBLE). Not read by change propagation; instance bindings supply CP
  // values at placement.
  optional google.protobuf.Any default_value = 4;
}

// The map of resolved parameters.
//
// Generally constructed by a `ParameterBindingsBehavior` as part of
// regeneration. Each entry's `Any` payload type is constrained by the
// corresponding `ParameterDeclaration.expected_type`.
message ResolvedParameters {
  option (motif.extension.v1.message).component = 90;

  // The resolved parameter values, keyed by parameter name.
  map<string, google.protobuf.Any> values = 1;
}

// A scalar expression node over f64 values. Shared by two consumers,
// distinguished by their binding-leaf kind:
//
//   * Change-propagation parameter bindings use the `binding` (`DataReference`)
//     leaf, addressing a `TYPE_DOUBLE` slot that must hold a `DoubleValue`
//     payload. The `parameter` leaf is rejected.
//   * Built-in asset geometry configurations use the `parameter` leaf, a name
//     looked up in the instance's resolved-parameter scope. The `binding`
//     (`DataReference`) leaf is rejected.
//
// The invalid leaf for a given consumer is rejected at decode.
message ParametricExpression {
  // The expression node.
  oneof node {
    // A literal f64 value.
    double literal = 1;

    // Change-propagation slot-ref leaf (parameter bindings only): a reference to
    // a `TYPE_DOUBLE` slot supplying the value.
    motif.extension.v1.DataReference binding = 2 [(motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}];

    // A binary operation over two sub-expressions.
    ParametricBinaryOp binary_op = 3;

    // Named-parameter leaf, looked up in the evaluation scope (geometry configs
    // only).
    string parameter = 4;

    // Arithmetic negation of a sub-expression.
    ParametricExpression neg = 5;

    // A conditional selecting between two sub-expressions.
    ParametricConditional conditional = 6;
  }
}

// A binary arithmetic operation applied to two sub-expressions.
message ParametricBinaryOp {
  // The operator applied to `left` and `right`.
  ParametricOperator operator = 1;
  // The left operand.
  ParametricExpression left = 2;
  // The right operand.
  ParametricExpression right = 3;
}

// Arithmetic operators supported in parametric expressions.
enum ParametricOperator {
  // Unspecified operator.
  PARAMETRIC_OPERATOR_UNSPECIFIED = 0;
  // Addition.
  PARAMETRIC_OPERATOR_ADD = 1;
  // Subtraction.
  PARAMETRIC_OPERATOR_SUB = 2;
  // Multiplication.
  PARAMETRIC_OPERATOR_MUL = 3;
  // Division.
  PARAMETRIC_OPERATOR_DIV = 4;
  // Minimum of the two operands.
  PARAMETRIC_OPERATOR_MIN = 5;
  // Maximum of the two operands.
  PARAMETRIC_OPERATOR_MAX = 6;
}

// Ordering predicates for `ParametricConditional`. Equality comparisons are
// deliberately absent: float equality over real-valued parameters is not
// meaningful.
enum ParametricComparisonOp {
  // Unspecified comparison operator.
  PARAMETRIC_COMPARISON_OP_UNSPECIFIED = 0;
  // Strictly less than.
  PARAMETRIC_COMPARISON_OP_LESS = 1;
  // Less than or equal.
  PARAMETRIC_COMPARISON_OP_LESS_EQUAL = 2;
  // Strictly greater than.
  PARAMETRIC_COMPARISON_OP_GREATER = 3;
  // Greater than or equal.
  PARAMETRIC_COMPARISON_OP_GREATER_EQUAL = 4;
}

// `if (lhs <op> rhs) then `then` else `otherwise``. Predicates exist only here,
// keeping the language single-typed over doubles. Only the taken branch is
// evaluated.
message ParametricConditional {
  // The comparison predicate applied to `lhs` and `rhs`.
  ParametricComparisonOp op = 1;
  // The comparison's left operand.
  ParametricExpression lhs = 2;
  // The comparison's right operand.
  ParametricExpression rhs = 3;
  // The value when the predicate holds.
  ParametricExpression then = 4;
  // The value when the predicate does not hold.
  ParametricExpression otherwise = 5;
}

// A parameter binding supplied by an instance to satisfy one entry in
// `ParameterDeclarations`.
//
// A binding is a literal `Any` payload (matching the declared `expected_type`),
// a `DataReference` pointing at a concrete value, or an arithmetic expression
// whose `binding` leaves are resolved against sibling bindings in the same
// behavior.
message ParameterBinding {
  // How the parameter value is supplied.
  oneof source {
    // A literal value matching the declared `expected_type`.
    google.protobuf.Any value = 1;

    // The bound value's type is resolved per `ParameterDeclaration` at runtime,
    // so a static data_reference_expected_type is intentionally not set here.
    // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
    motif.extension.v1.DataReference data_ref = 2;

    // An arithmetic expression whose `binding` leaves resolve against sibling
    // bindings in the same behavior.
    ParametricExpression expression = 3;
  }
}

// The behavior which operates on `ParameterDeclarations` and `ResolvedParameters`.
//
// This behavior's regeneration logic is as follows:
// * Find the `ParameterDeclarations` component by following the `declarations`
//   pointer.
// * Construct a `ResolvedParameters` component from the keys in
//   `ParameterDeclarations` and values in `bindings`.
// * Write the `ResolvedParameters` component to the `resolved` entity.
message ParameterBindingsBehavior {
  option (motif.extension.v1.message).component = 91;

  // Pointer to the source `ParameterDeclarations`.
  motif.extension.v1.DataReference declarations = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.ParameterDeclarations"
    }
  ];

  // Pointer to the `ResolvedParameters` destination.
  motif.extension.v1.DataReference resolved = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.ResolvedParameters"
    }
  ];

  // The bindings used to resolve each declared parameter, keyed by name.
  map<string, ParameterBinding> bindings = 3;
}

// A behavior which generates a three-dimensional solid.
//
// The solid is constructed as follows:
// * A rectangular profile is created from the `width` and `height` values in a
//   plane perpendicular to the one defined by `coordinate_system`. The profile
//   is centered on `curve`.
// * The generated profile is swept along the curve from start to end.
// * The generated solid is written to the `output` entity as a `Shape`.
message SweepWidthHeightAlongCurveBehaviorV2 {
  option (motif.extension.v1.message).component = 92;

  // The profile width.
  motif.extension.v1.DataReference width = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The profile height.
  motif.extension.v1.DataReference height = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The curve to sweep the profile along.
  motif.extension.v1.DataReference curve = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The coordinate system that places the curve and profile in world space.
  motif.extension.v1.DataReference coordinate_system = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];
}

// Sweeps a closed profile along a spine, where both the profile and the spine
// are ordered lists of `Curve2` segments (one `Curve2List` parameter value
// each), rather than a width/height rectangle. The spine `curves` are swept in
// the `coordinate_system`; a single spine segment produces a smooth solid pipe
// while multiple segments produce a pipe-shell with right-corner transitions at
// the joints. The generated solid is written to the `output` entity as a
// `Shape`.
message SweepProfileAlongCurvesBehaviorV2 {
  option (motif.extension.v1.message).component = 129;

  // Spine: ordered `Curve2` segments. One segment sweeps a smooth pipe; many
  // sweep a mitered pipe-shell.
  motif.extension.v1.DataReference curves = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Curve2List"
    }
  ];

  // Closed profile loop, as one `Curve2List` value.
  motif.extension.v1.DataReference profile = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Curve2List"
    }
  ];

  // Coordinate system the spine/profile curves live in.
  motif.extension.v1.DataReference coordinate_system = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];
}

// A behavior which generates one part of a built-in parametric asset assembly.
//
// Regeneration resolves the named `inputs` into a parameter map, evaluates the
// asset's stored `configuration` against it to obtain the engine-agnostic asset
// parts, looks up the part selected by `part_index`, sweeps or extrudes it (in
// the part's own self-placing frame), and writes the result to the `output`
// entity as a `Shape`.
//
// Distinct from `SweepWidthHeightAlongCurveBehaviorV2` (which only sweeps a
// *centered rectangle* along a *single* curve): asset parts are arbitrary
// non-rectangular profiles, anchored origin-on-spine, swept along multi-segment
// / closed spines (or extruded, for e.g. a glazing pane).
message BuiltinAssetPartBehaviorV2 {
  option (motif.extension.v1.message).component = 105;

  // Resolved parameter inputs keyed by parameter name (e.g. "width" /
  // "height"). The configuration's decoder validates the value types it needs;
  // types are not constrained per-entry here.
  // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
  map<string, motif.extension.v1.DataReference> inputs = 2;

  // Index into the evaluated configuration's parts selecting which part this
  // behavior builds.
  uint32 part_index = 3;

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];

  // The asset entity's stored configuration the parts are evaluated from.
  // Required.
  motif.extension.v1.DataReference configuration = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.BuiltinAssetConfiguration"
    }
  ];
}

// Stored, expression-driven definition of a built-in asset assembly's parts.
//
// Placed permanently on a `CONFIGURATION_DRIVEN` asset entity alongside its
// `BuiltinAssetAssembly` marker. Each part's geometry is a sweep/extrude recipe
// whose scalars are expression trees over named parameters; evaluating the
// configuration against an instance's resolved parameter scope yields the same
// engine-agnostic parts vocabulary the code-authored recipes produce
// (`builtin_asset_recipes::geometry_parts::AssetPart`), so consumers bake
// configured and code-authored assemblies identically.
//
// The expression language is single-typed (every expression is a finite double
// in meters) and exactly IEEE-754-specified, so evaluation is deterministic.
// Structural limits (expression depth, part and point counts) are enforced at
// decode.
message BuiltinAssetConfiguration {
  option (motif.extension.v1.message).component = 119;

  // Minimum reader version required to interpret this configuration. Readers
  // built against an older supported version reject higher-versioned payloads
  // up front. Bump only for semantic extensions an older evaluator cannot
  // represent (new ops, new geometry kinds); purely additive optional fields do
  // not bump it. The encoder sets the minimum a payload actually needs: 2 when
  // any part uses curve geometry (`curve_sweep`/`curve_extrude`), otherwise 1.
  uint32 version = 1;

  // The assembly's parts, in stable authoring order (a per-part behavior's
  // `part_index` indexes this list).
  repeated Part parts = 2;

  // Scalar expressions over named parameters use the shared
  // `ParametricExpression` (its `parameter`/`literal`/`binary_op`/`neg`/
  // `conditional` leaves); the `binding` (`DataReference`) leaf is rejected here
  // at decode.

  // A 2D point whose coordinates are parametric expressions.
  message Point2Expr {
    // The x-coordinate expression.
    ParametricExpression x = 1;
    // The y-coordinate expression.
    ParametricExpression y = 2;
  }

  // A 3D point whose coordinates are parametric expressions.
  message Point3Expr {
    // The x-coordinate expression.
    ParametricExpression x = 1;
    // The y-coordinate expression.
    ParametricExpression y = 2;
    // The z-coordinate expression.
    ParametricExpression z = 3;
  }

  // A single spine/profile curve segment, built on the fly from expression
  // points at evaluation time (the concrete `Curve2` is never persisted). Each
  // variant maps to a point-based constructor in the `geometry` crate. Nurbs
  // curves are deliberately unsupported.
  message CurveExpr {
    // The curve segment kind.
    oneof curve {
      // Straight segment `start -> end` (`geometry::Line2::from_points`).
      LineCurve line = 1;
      // Circular arc through three points
      // (`geometry::Circle2::from_arc_points`).
      ArcCurve arc = 2;
      // Elliptical arc through start/end plus a middle point
      // (`geometry::Ellipse2::from_ellipse_points`).
      EllipseArcCurve ellipse_arc = 3;
    }
  }

  // A straight segment defined by two expression endpoints.
  message LineCurve {
    // The segment start point.
    Point2Expr start = 1;
    // The segment end point.
    Point2Expr end = 2;
  }

  // A circular arc through three expression points.
  message ArcCurve {
    // The arc start point.
    Point2Expr start = 1;
    // A point on the arc between `start` and `end`.
    Point2Expr mid = 2;
    // The arc end point.
    Point2Expr end = 3;
  }

  // An elliptical arc through start/end plus a middle point.
  message EllipseArcCurve {
    // The arc start point.
    Point2Expr start = 1;
    // The arc end point.
    Point2Expr end = 2;
    // A point on the arc between `start` and `end`.
    Point2Expr middle = 3;
  }

  // Sweep an ordered curve profile along an ordered curve spine. Unlike
  // `SweepExpr`, spine and profile are curve segments (lines/arcs) rather than
  // straight-polyline points: spine connectivity is explicit in the ordered
  // curves, and the profile curves must themselves form a closed loop.
  message CurveSweepExpr {
    // The ordered spine curve segments.
    repeated CurveExpr spine = 1;
    // The ordered profile curve segments (a closed loop).
    repeated CurveExpr profile = 2;
  }

  // Extrude a closed curve profile (lines/arcs) along the frame's `+Z`.
  message CurveExtrudeExpr {
    // The closed profile curve segments.
    repeated CurveExpr profile = 1;
    // The extrusion depth, in meters.
    ParametricExpression depth_m = 2;
    // The extrusion start offset along `+Z`, in meters.
    ParametricExpression depth_start_m = 3;
  }

  // The frame embedding a part's 2D recipe into 3D: expression origin, *literal*
  // unit axes (a parameter-dependent rotation would require normalization, which
  // the language cannot express; no recipe needs it).
  message FrameExpr {
    // The frame origin.
    Point3Expr origin = 1;
    // The frame x-axis.
    motif.data.geometry.v1.UnitVector3 x_axis = 2;
    // The frame z-axis.
    motif.data.geometry.v1.UnitVector3 z_axis = 3;
  }

  // A single part of the assembly.
  message Part {
    // Display label (e.g. "Jamb"); becomes the materialized child entity's
    // name.
    string name = 1;
    // The part's display color.
    motif.data.style.v1.Color.Srgb color = 2;
    // Display opacity in [0, 1]; absent = fully opaque.
    optional float opacity = 3;
    // The part's geometry recipe.
    oneof geometry {
      // Sweep a curve profile along a curve spine.
      CurveSweepExpr curve_sweep = 7;
      // Extrude a curve profile along the frame's `+Z`.
      CurveExtrudeExpr curve_extrude = 8;
    }
    // The frame embedding the 2D recipe into 3D.
    FrameExpr frame = 6;
  }
}

// Identifies a behavior whose regeneration function is as follows:
// * Read the `Shape` component from the `shape` reference.
// * Convert the `Shape` into a triangular mesh.
// * Write the mesh to the `mesh` reference.
message ConvertShapeToMeshBehavior {
  option (motif.extension.v1.message).component = 93;

  // The source shape to convert.
  motif.extension.v1.DataReference shape = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];

  // The entity the generated `Mesh` is written to.
  motif.extension.v1.DataReference mesh = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Mesh"
    }
  ];
}

// B-rep geometry.
//
// `bodies` carries one OCCT BRepTools binary payload per body in the shape.
message Shape {
  option (motif.extension.v1.message).component = 94;

  // One OCCT BRepTools binary payload per body.
  repeated bytes bodies = 1;
}

// The type of join represented.
enum JoinKind {
  // Unspecified join kind.
  JOIN_KIND_UNSPECIFIED = 0;
  // A butt join.
  JOIN_KIND_BUTT = 1;
}

// Which part of the participant's curve is anchored at the join.
//
// `START` / `END` point at a specific spine endpoint. `CURVE` indicates that
// the participant's whole curve takes part in the join (the participant
// passes through the join location rather than terminating at it). A
// participant with `CURVE` is always treated as the through wall regardless
// of its position in `JoinBehavior.participants`; the other participant must
// then carry a `START` or `END` endpoint that lies on the through wall's
// curve. A join with two `CURVE` participants is rejected.
enum JoinEndpointKind {
  // Unspecified endpoint kind.
  JOIN_ENDPOINT_KIND_UNSPECIFIED = 0;
  // The participant's curve start is anchored at the join.
  JOIN_ENDPOINT_KIND_START = 1;
  // The participant's curve end is anchored at the join.
  JOIN_ENDPOINT_KIND_END = 2;
  // The participant's whole curve takes part in the join.
  JOIN_ENDPOINT_KIND_CURVE = 3;
}

// Per-entity layout description that turns an entity into a join participant.
//
// Holds four `DataReference`s naming the participant's `curve`, `width`,
// `coordinate_system`, and `shape` slots.
//
// ## Two manual copy steps
//
// `JoinableMetadata` is the source of truth for "where does this entity keep
// its joinable layout?". It is currently propagated by **two manual copies**
// performed outside change propagation:
//
//  1. **Asset → Instance (at instance-creation time).** When a tool/runtime
//     spawns an instance of an asset that has `JoinableMetadata`, it copies
//     the component verbatim onto the instance entity. Because the inner
//     `DataReference`s use `this_entity`, the same wire bytes naturally resolve
//     to the instance's own slots when re-decoded on the instance.
//
//     **Why this is manual, not a behavior:** the obvious alternative is an
//     asset-attached "AssignJoinableMetadata" behavior that materializes the
//     instance copy at regen time. Change propagation does not currently
//     support regenerating data that itself contains `DataReference`s and then
//     consuming those `DataReference`s in the same regeneration pass — the
//     framework has no story for "this slot was just produced by a regen and
//     also needs its inner pointers to be honored by downstream resolve calls
//     in the same pass." When that capability is added, this copy should become
//     a behavior.
//
//  2. **Instance → Join (at join-creation time).** When a tool authors a new
//     `JoinBehavior`, it reads each participant entity's `JoinableMetadata`
//     and copies the four inner `DataReference`s into the corresponding
//     `JoinParticipant` fields on the join entity. The copy must **remap
//     `this_entity` to an explicit `entity_id` (the participant entity id)**
//     because the join entity is *not* the participant entity, so leaving the
//     wire form as `this_entity` would resolve to the wrong host.
//
//     **Why this is also manual:** the natural alternative is for
//     `JoinParticipant` to hold a single `DataReference` to the participant's
//     `JoinableMetadata` and have the framework follow that pointer to
//     discover the four leaf refs. Change propagation's persistence loader
//     does **single-hop** `DataReference` walks — it loads what a relationship's
//     direct refs point at, but does not then walk the loaded component's
//     own refs. As a result, the participant's `Shape`/`ResolvedParameters`
//     never enter the model and `JoinBehavior::register` cannot resolve
//     them. Until the loader grows multi-hop / recursive walks (an explicit
//     framework change), the join carries the leaf refs directly.
//
// **Why the copies are safe:** in both cases we are copying *structural*
// pointers (slot kinds + paths), not the values they point at. The inner
// `DataReference`s do not change once the asset is authored — only the values at
// the targeted slots do, and those are re-resolved at each regen via the
// (single) hop the framework already performs.
message JoinableMetadata {
  option (motif.extension.v1.message).component = 95;

  // The participant's spine curve slot.
  motif.extension.v1.DataReference curve = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The participant's width slot.
  motif.extension.v1.DataReference width = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The participant's coordinate-system slot.
  motif.extension.v1.DataReference coordinate_system = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The participant's shape slot.
  motif.extension.v1.DataReference shape = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];
}

// Data references to one participant's state needed by the join.
message JoinParticipant {
  // The participant's spine curve slot.
  motif.extension.v1.DataReference curve = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // The participant's width slot.
  motif.extension.v1.DataReference width = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The participant's coordinate-system slot.
  motif.extension.v1.DataReference coordinate_system = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // The participant's shape slot.
  motif.extension.v1.DataReference shape = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];

  // Which part of the participant's curve is anchored at the join.
  JoinEndpointKind endpoint = 5;
}

// A behavior which defines a join between one or more participants.
//
// Participants are assigned priority based on the order of the `participants`
// collection. The first and second participants are the primary definers of the
// result geometry, and all other participants adapt to that geometry. In the
// future we will allow changing priority without modifying the collection.
message JoinBehavior {
  option (motif.extension.v1.message).component = 96;

  // The kind of join.
  JoinKind kind = 1;
  // The participants in the join, in priority order.
  repeated JoinParticipant participants = 2;
}

// A planar hosting surface trimmed to the valid placement region on a host
// entity.
//
// The hosting plane is computed from the same inputs as the host's swept
// geometry so the two stay consistent: `curve` + `coordinate_system` give the
// plane's origin (curve start), its u-axis (curve start tangent) and normal (the
// host's thickness direction), and the u-extent (the curve length); `height` is
// the v-extent (the host height, measured from the base up).
message TrimmedHostingSurface {
  option (motif.extension.v1.message).component = 97;

  // The trimmed hosting plane.
  motif.data.geometry.v1.Plane surface = 1;

  // The host's spine curve, in `coordinate_system` space. Supplies the plane
  // origin, u-axis and u-extent (the curve length).
  motif.extension.v1.DataReference curve = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2"
    }
  ];

  // Plane height extent (v) in the plane's parametric coordinates.
  motif.extension.v1.DataReference height = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The coordinate system that lifts `curve` into world space (the host spine
  // frame).
  motif.extension.v1.DataReference coordinate_system = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];
}

// A behavior which identifies an entity as a host for other hosted entities.
message HostBehavior {
  option (motif.extension.v1.message).component = 98;

  // The host's trimmed hosting surface.
  motif.extension.v1.DataReference hosting_surface = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.TrimmedHostingSurface"
    }
  ];
}

// A behavior which identifies an entity as hosted on another entity's hosting
// surface.
//
// Regeneration reads the host's trimmed hosting surface and the stored
// parametric coordinate, then writes the hosted entity's absolute transform.
message HostedBehavior {
  option (motif.extension.v1.message).component = 99;

  // The host's trimmed hosting surface.
  motif.extension.v1.DataReference host_surface = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.TrimmedHostingSurface"
    }
  ];

  // The parametric coordinate on the hosting surface.
  motif.extension.v1.DataReference parametric_coordinate = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Point2"
    }
  ];

  // The entity the computed absolute transform is written to.
  motif.extension.v1.DataReference absolute_transform = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Isometry"
    }
  ];
}

// A behavior which subtracts one profile solid from a target geometry.
//
// Regeneration reads the target geometry, builds a profile solid from the
// supplied dimensions and placement on the host surface, and writes the cut
// result back to the target geometry slot using a pipeline write sequence.
message CutGeometryBehavior {
  option (motif.extension.v1.message).component = 100;

  // The geometry to cut into; the cut result is written back here.
  motif.extension.v1.DataReference target_geometry = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];

  // The hosted element's world-space placement transform (e.g. the `Isometry` a
  // `HostedBehavior` writes). Its translation is the cut center; its rotation
  // supplies the host-surface frame from which the cut derives the profile plane
  // and the extrusion direction.
  motif.extension.v1.DataReference cut_transform = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.core.v1.Isometry"
    }
  ];

  // World-space extrusion vector for the cutter prism. Thickness is
  // `|extrusion|`.
  motif.extension.v1.DataReference extrusion = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Vector3"
    }
  ];

  // The profile width.
  motif.extension.v1.DataReference profile_width = 4 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // The profile height.
  motif.extension.v1.DataReference profile_height = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];
}

// Extrudes a closed boundary profile perpendicular to a workplane.
//
// Regeneration reads the workplane coordinate system, a closed `Curve2List`
// profile in workplane-local coordinates, and `thickness`, builds a planar face
// from the closed wire, and extrudes it along ± the workplane normal (sign
// baked on the asset via `extrude_along_workplane_normal`). The solid is
// written to the `output` entity as a `Shape`.
message ExtrudeBoundaryProfileBehavior {
  option (motif.extension.v1.message).component = 141;

  // Workplane the boundary profile lies in.
  motif.extension.v1.DataReference workplane = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.CoordinateSystem3"
    }
  ];

  // Closed profile loop as an ordered list of workplane-local `Curve2` segments.
  motif.extension.v1.DataReference profile = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.geometry.v1.Curve2List"
    }
  ];

  // Extrusion distance (meters).
  motif.extension.v1.DataReference thickness = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {kind: TYPE_DOUBLE}
  ];

  // When true, extrude along +workplane normal (ceiling); when false, along
  // -normal (floor).
  bool extrude_along_workplane_normal = 4;

  // The entity the generated `Shape` is written to.
  motif.extension.v1.DataReference output = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.Shape"
    }
  ];
}

// Points at the original asset that was materialized. The result of
// materializing a parametric asset is pointed at by `Instance`; this points back
// at the source. For non-parametric assets, this is not present.
message SourceAsset {
  option (motif.extension.v1.message).component = 130;

  // The source asset entity that was materialized. Required.
  motif.extension.v1.EntityReference entity = 1 [(buf.validate.field).required = true];

  // Optional. When set, the source entity is resolved against this model and
  // version rather than the materialized entity's own model.
  motif.extension.v1.ModelReference model = 2;
}

// A behavior which keeps a Point3 on a host Curve2.
//
// Regeneration reads the host curve and the stored normalized CurveHostParam,
// evaluates the curve at that parameter, and writes plane-local Point3
// coordinates (z = 0) to the output.
message CurveHostedPointBehavior {
  option (motif.extension.v1.message).component = 152;

  // The host curve geometry.
  motif.extension.v1.DataReference host_curve = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Curve2"
    }
  ];

  // The normalized host parameter on the hosted point entity.
  motif.extension.v1.DataReference host_param = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.CurveHostParam"
    }
  ];

  // The entity the computed plane-local Point3 is written to.
  motif.extension.v1.DataReference output = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Point3"
    }
  ];
}

// A behavior which keeps a hosting-surface plane attached to a host point.
//
// Regeneration reads the host point's absolute transform, applies its rotation
// to the authored local plane axes, and rewrites the target
// TrimmedHostingSurface's plane so hosted instances (HostedBehavior) follow the
// point's translation and rotation.
message PointHostedPlaneBehavior {
  option (motif.extension.v1.message).component = 153;

  // The host point's transform source. Either a `motif.data.core.v1.Isometry`
  // (plane origin and orientation) or a `motif.data.model.v1.Point3`
  // (plane origin only; authored axes are used unrotated). The latter supports
  // curve-hosted points whose position is itself CP-derived.
  //
  // The expected type is resolved at runtime (Isometry or Point3), so a static
  // data_reference_expected_type is intentionally not set here.
  // buf:lint:ignore MOTIF_DATA_REFERENCE_MISSING_EXPECTED_TYPE
  motif.extension.v1.DataReference host_transform = 1 [(buf.validate.field).required = true];

  // The plane's u axis in the host point's local frame.
  motif.data.geometry.v1.Vector3 x_axis = 2;

  // The plane's normal in the host point's local frame.
  motif.data.geometry.v1.Vector3 z_axis = 3;

  // Half-extent of the plane's square parametric domain, in meters.
  double half_extent = 4;

  // The trimmed hosting surface whose plane is recomputed.
  motif.extension.v1.DataReference output_surface = 5 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.TrimmedHostingSurface"
    }
  ];
}

// Per-instance composed sweep inputs for a two-point bar (structural member
// spanning two node points; cf. BHoM's Bar = start node + end node + section).
//
// Written by `TwoPointBarBehavior` from the two node points; consumed by the
// bar asset's `SweepWidthHeightAlongCurveBehaviorV2` via per-field
// `DataReference`s (field 1 = curve, field 2 = coordinate_system).
message ResolvedBarSweepInputs {
  option (motif.extension.v1.message).component = 154;

  // The bar's spine in its placement frame: a line from local (0,0) with
  // length = the node-to-node distance.
  motif.data.geometry.v1.Curve2 curve = 1;

  // The bar's placement frame: origin at the start node, local X toward the
  // end node, local Z the perpendicularized global up (section top faces up).
  motif.data.geometry.v1.CoordinateSystem3 coordinate_system = 2;
}

// A persisted parametric surface host spanning one or more rail curves.
//
// With two rails the surface is ruled: `S(u, v)` linearly blends the rails'
// world points at normalized parameter `u` in `[0, 1]`, with `v` in `[0, 1]`
// from rail 0 to rail 1. With three or more rails the surface is a piecewise
// ruled loft: `v` in `[0, 1]` spans the rails uniformly, blending within each
// consecutive pair. With one rail the surface is an extrusion: the rail swept
// along `direction`, with `v` in `[0, 1]` scaling the vector.
//
// Rails are referenced by entity id; each rail entity carries the `Curve2`
// (plane-local) and its sketch membership supplies the world plane. Only the
// atoms are persisted — evaluation and tessellation are derived client-side.
message MultiRailSurface {
  option (motif.extension.v1.message).component = 156;

  // The rail curve entities, in order. One rail = extruded, two = ruled,
  // three or more = piecewise ruled loft.
  repeated motif.extension.v1.EntityReference rails = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 8
  }];

  // World-space extrusion vector in meters; read only when one rail is given.
  motif.data.geometry.v1.Vector3 direction = 2;
}

// Which surface parameter a persisted isoparametric curve holds fixed.
enum SurfaceIsoDirection {
  SURFACE_ISO_DIRECTION_UNSPECIFIED = 0;
  // `u` fixed: the curve runs across the rails (along `v`).
  SURFACE_ISO_DIRECTION_U = 1;
  // `v` fixed: the curve runs along the rails (along `u`).
  SURFACE_ISO_DIRECTION_V = 2;
}

// An isoparametric curve hosted on a MultiRailSurface entity.
//
// Stores only the host reference, fixed direction, and normalized parameter —
// the world-space polyline is derived client-side by sampling the host
// surface, so the curve follows every surface edit (rail geometry or
// workplane/level moves). Deleting the host deletes its iso curves.
message SurfaceIsoCurve {
  option (motif.extension.v1.message).component = 157;

  // The host surface entity (carries `MultiRailSurface`).
  motif.extension.v1.EntityReference surface = 1 [(buf.validate.field).required = true];

  // Which parameter is held fixed.
  SurfaceIsoDirection direction = 2;

  // The fixed parameter value, normalized to [0, 1].
  double param = 3 [(buf.validate.field).double = {
    gte: 0.0
    lte: 1.0
  }];
}

// A parameter binding keeping a Point3 hosted on a MultiRailSurface entity.
//
// Stores the host reference and normalized `(u, v)`; the point's world
// position is derived client-side by evaluating the host surface, so the
// point follows every surface edit (rail geometry or workplane/level moves).
// Deleting the host deletes its hosted points.
message SurfaceHostParam {
  option (motif.extension.v1.message).component = 158;

  // The host surface entity (carries `MultiRailSurface`).
  motif.extension.v1.EntityReference surface = 1 [(buf.validate.field).required = true];

  // Normalized `u` along the rails, in [0, 1].
  double u = 2 [(buf.validate.field).double = {
    gte: 0.0
    lte: 1.0
  }];

  // Normalized `v` across the rails, in [0, 1].
  double v = 3 [(buf.validate.field).double = {
    gte: 0.0
    lte: 1.0
  }];
}

// Which curve kind a through-points curve derives from its driver points.
enum CurveThroughPointsKind {
  CURVE_THROUGH_POINTS_KIND_UNSPECIFIED = 0;
  // Piecewise linear segments through the points (2 points = a line).
  CURVE_THROUGH_POINTS_KIND_LINE = 1;
  // A circular arc through exactly three points.
  CURVE_THROUGH_POINTS_KIND_ARC = 2;
  // An interpolating NURBS spline through the points.
  CURVE_THROUGH_POINTS_KIND_SPLINE = 3;
}

// A binding deriving a sketch curve's geometry from driver Point3 entities.
//
// The referenced points act as the curve's user control points: whenever a
// driver point moves (directly, or derived — e.g. a surface-hosted point),
// the curve's plane-local `Curve2` is recomputed from the points' world
// positions projected onto the curve's sketch plane. Deleting a driver point
// deletes the curve.
message CurveThroughPoints {
  option (motif.extension.v1.message).component = 159;

  // The driver Point3 entities, in order.
  repeated motif.extension.v1.EntityReference points = 1 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 64
  }];

  // How the points become geometry.
  CurveThroughPointsKind kind = 2;

  // Interpolating spline order (degree + 1); read only for KIND_SPLINE.
  // Zero selects the default (3).
  uint32 order = 3;
}

// A curtain subdivision system hosted on a MultiRailSurface entity.
//
// Owns CurtainGridLine children (explicit U/V param DOFs). Cell topology is
// derived client-side from the lines — not persisted. Deleting the host
// surface deletes the system (Requires cascade).
message CurtainSystem {
  option (motif.extension.v1.message).component = 160;

  // The host surface entity (carries `MultiRailSurface`).
  motif.extension.v1.EntityReference surface = 1 [(buf.validate.field).required = true];
}

// A curtain grid line — one DOF of a CurtainSystem (iso U or V at a param).
//
// Same atom *shape* as SurfaceIsoCurve (dir + param) but owned by a system
// and drives derived cell topology. World polyline is sampled from the
// system's host surface client-side. Deleting the system deletes its lines.
message CurtainGridLine {
  option (motif.extension.v1.message).component = 161;

  // The owning CurtainSystem entity.
  motif.extension.v1.EntityReference system = 1 [(buf.validate.field).required = true];

  // Which surface parameter is held fixed (reuse SurfaceIsoDirection).
  SurfaceIsoDirection direction = 2;

  // The fixed parameter value, normalized to [0, 1].
  double param = 3 [(buf.validate.field).double = {
    gte: 0.0
    lte: 1.0
  }];
}

// A behavior which keeps a bar spanning two node points.
//
// Regeneration reads both nodes' Point3 positions and rewrites the target
// ResolvedBarSweepInputs (spine line + placement frame), so the bar follows
// its nodes — including nodes whose Point3 is itself CP-derived (e.g.
// curve-hosted points).
message TwoPointBarBehavior {
  option (motif.extension.v1.message).component = 155;

  // The start node's position.
  motif.extension.v1.DataReference start_point = 1 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Point3"
    }
  ];

  // The end node's position.
  motif.extension.v1.DataReference end_point = 2 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.model.v1.Point3"
    }
  ];

  // The ResolvedBarSweepInputs the composed spine + frame are written to.
  motif.extension.v1.DataReference output = 3 [
    (buf.validate.field).required = true,
    (motif.extension.v1.field).data_reference_expected_type = {
      kind: TYPE_MESSAGE
      type_name: "motif.data.temporary.v1.ResolvedBarSweepInputs"
    }
  ];
}
