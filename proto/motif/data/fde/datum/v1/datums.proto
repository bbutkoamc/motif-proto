syntax = "proto3";

// Sketch datums: reference planes and structural column grids used as sketch
// hosts.
package motif.data.fde.datum.v1;

import "buf/validate/validate.proto";
import "motif/extension/v1/options.proto";

// A named reference plane used as a sketch host (any orientation).
message ReferencePlane {
  option (motif.extension.v1.message).component = 11;
}

// Container for a structural column grid (the persisted datum, not the display
// grid).
message GridSystem {
  option (motif.extension.v1.message).component = 21;
}

// One vertical grid-line plane; its sketch host is the `CoordinateSystem3`
// component on the same entity.
message GridLine {
  option (motif.extension.v1.message).component = 22;
}

// A display label for a grid line (e.g. "A", "1").
message GridLineLabel {
  option (motif.extension.v1.message).component = 30;

  // The label text.
  string label = 1;
}

// The drawn rectangle of a column grid or reference plane, in that datum's
// own plane. Centres and spans are meters along the `CoordinateSystem3` local
// axes: local X along the line, local Y up on a vertical plane.
message DatumExtent {
  option (motif.extension.v1.message).component = 224;

  // Centre along local X, in meters from the pose origin.
  double center_u = 1 [(buf.validate.field).double.finite = true];

  // Centre along local Y, in meters from the pose origin.
  double center_v = 2 [(buf.validate.field).double.finite = true];

  // Full span along local X, in meters.
  double length_u = 3 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];

  // Full span along local Y, in meters.
  double length_v = 4 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];
}
