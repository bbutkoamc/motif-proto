syntax = "proto3";

// Component types for persisted agent UIs.
package motif.data.ai.v1;

import "buf/validate/validate.proto";
import "motif/extension/v1/options.proto";

// A persisted agent UI: a durable, replayable surface an AI agent emitted
// (A2UI) that a user saved for reuse, instead of letting it expire with the
// chat turn.
//
// The component is the UI kind's marker: what kind of artifact the entity is
// follows from this component's presence
// Retrieve a catalog with a Query scoped to the library model id and
// where_all_components = [151], selecting `AssignedName` and `AgentUI` —
// listing never requires fetching a body.
//
// A canonical UI will typically be stored as an entity in a dedicated, `Hidden`-marked
// library model (the same pattern as `AgentSkill`), conventionally composed
// with:
//   - `AssignedName` — the UI's display name,
//   - `Representation` — the UI body: a normalized, replayable A2UI message
//     bundle (`MIME_TYPE_JSON`), not the raw token stream.
// Readers should tolerate the absence of either. Editing a UI uploads a new
// representation and updates the pointer; existing revisions stay readable,
// and model-local instances remain pinned to the revision they reference.
//
// The runtime declares how the body is validated and rendered. Saved bodies
// must be self-contained: no conversation secrets, credentials, transient run
// identifiers, or references to other Motif assets.
message AgentUI {
  option (motif.extension.v1.message).component = 151;

  // How the UI body in `Representation` is validated and rendered.
  AgentUIRuntime runtime = 1 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];

  // The A2UI specification version the body conforms to (e.g. "0.9").
  // Set when `runtime` is `AGENT_UI_RUNTIME_A2UI`.
  string a2ui_version = 2 [(buf.validate.field).string.max_len = 32];

  // What the UI shows and when it is useful, in one or two sentences. Shown
  // in UI catalogs; not parsed from the body.
  string description = 3 [(buf.validate.field).string.max_len = 1024];
}

// The runtime a persisted agent UI targets. Finer distinctions within a
// runtime (e.g. the A2UI version) are fields on `AgentUI`, and the body's
// media type comes from `Representation` — the runtime is not a general
// artifact discriminator.
enum AgentUIRuntime {
  // Unspecified runtime.
  AGENT_UI_RUNTIME_UNSPECIFIED = 0;
  // A declarative, replayable A2UI message bundle rendered by the host.
  AGENT_UI_RUNTIME_A2UI = 1;
  // Reserved for a future sandboxed-iframe HTML runtime. Defined so the enum
  // is stable, but not accepted by any writer until that runtime clears its
  // own security review and feature gate.
  AGENT_UI_RUNTIME_IFRAME_HTML = 2;
}
