syntax = "proto3";

// Spatial room components: room identity, WKB plan boundaries with per-segment
// bounding-element references, a record of which element formed each edge, and
// portals linking openings to rooms.
package motif.data.spatial.v1;

import "buf/validate/validate.proto";
import "motif/data/geometry/v1/geometry.proto";
import "motif/extension/v1/options.proto";
import "motif/extension/v1/reference.proto";

// Maps one curve of a boundary ring to the element that forms that curve.
//
// Ring 0 is the exterior; rings 1..N are holes. This message does not store
// the rings. The component that carries the reference says where those rings live.
message BoundarySegmentReference {
  // Zero-based ring. 0 is the exterior; 1..N are holes.
  uint32 ring_index = 1;
  // Zero-based index of the curve within that ring.
  uint32 segment_index = 2;
  // The wall, column, or other element that forms this edge.
  motif.extension.v1.EntityReference bounding_entity = 3;
  // Set when bounding_entity belongs to a linked model; omit for the host.
  motif.extension.v1.ModelReference bounding_model = 4;
}

// Authoritative 2D room bounds as curve loops and an OGC WKB Polygon in
// level-local UV meters, plus references to the elements that form each curve.
//
// The loops and WKB represent the same boundary. Z/elevation is not stored in
// either representation; it comes from the room's PlanarReference level.
// Bounding-element type is read from the referenced entity's components.
message SpatialBoundary2D {
  option (motif.extension.v1.message).component = 160;

  // OGC WKB Polygon (2D), level-local UV meters. Exterior ring 0, then holes.
  bytes wkb = 1;

  // Maps loop/curve indexes to the elements that bound them.
  repeated BoundarySegmentReference segment_references = 2;

  // Ordered closed boundary loops in level-local UV meters. Loop 0 is the
  // exterior; loops 1..N are holes.
  repeated motif.data.geometry.v1.Curve2List loops = 3;
}

// One edge of a boundary and the element that forms it.
//
// Indexes match BoundarySegmentReference: ring 0 is the exterior, rings 1..N
// are holes, and segment_index is the curve within that ring. This message
// does not store the rings. The component that carries this entry says where
// those rings live, and which model the element is in. An entry that names no
// element is not a record.
message BoundarySource {
  // Zero-based ring. 0 is the exterior; 1..N are holes.
  uint32 ring_index = 1;
  // Zero-based index of the curve within that ring.
  uint32 segment_index = 2;
  // The wall, column, or other element that forms this edge.
  motif.extension.v1.EntityReference bounding_entity = 3 [(buf.validate.field).required = true];
}

// Which element in the containing model formed each edge of a boundary.
//
// This component stores no geometry. ring_index and segment_index on each
// entry address the boundary held elsewhere on the same entity: ring 0 is the
// exterior, rings 1..N are holes, and segment_index is the curve within that
// ring. A later change to a bounding element does not rewrite this list.
//
// There is no ModelReference. Each element is in the model that contains this
// component. An edge in a linked model is a segment of
// LinkedBoundarySources, so a host edge and a linked edge do not share a
// component and the linked model is not applied to the host entity.
//
// A reference here does not keep its target alive. Removing the bounding
// element leaves the boundary in place. Presence of this component does not
// mark the entity as a room.
message BoundarySources {
  option (motif.extension.v1.message).component = 186;

  // One entry per remembered edge in this model. Empty is not a record, and
  // each entry names its element.
  repeated BoundarySource segments = 1 [(buf.validate.field).repeated.min_items = 1];
}

// Edges of one boundary whose elements all belong to one linked model.
//
// A ModelReference qualifies every entity reference in its component. One on
// each edge rejects two edges that name the same model, and one host edge
// beside one linked edge applies the linked model to both entity ids. This
// component carries the model once. Every segment resolves against it, so two
// edges in that model are two segments. A host edge stays on
// BoundarySources.
//
// An edge in a second linked model is not a segment here. A component has one
// ModelReference, and an entity carries one of this component.
//
// This component stores no geometry. Indexes address the boundary held
// elsewhere on the same entity. A reference does not keep its target alive.
// Removing the bounding element leaves the boundary in place. Presence of
// this component does not mark the entity as a room.
message LinkedBoundarySources {
  option (motif.extension.v1.message).component = 187;

  // The model every segment's element belongs to.
  motif.extension.v1.ModelReference model = 1 [(buf.validate.field).required = true];

  // One entry per remembered edge in that model. Empty is not a record, and
  // each entry names its element.
  repeated BoundarySource segments = 2 [(buf.validate.field).repeated.min_items = 1];
}

// Room identity: source display name and schedule number.
//
// Presence of this component marks the entity as a room. Do not mirror name or
// number onto DefaultName or ForeignProperties.
message Room {
  option (motif.extension.v1.message).component = 161;

  // Source display name.
  string name = 1;
  // Source schedule number.
  string number = 2;
}
