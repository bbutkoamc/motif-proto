# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: proto
    name: buf.build/motif/platform
deps:
  - buf.build/bufbuild/protovalidate
plugins:
  - plugin: buf.build/motif/motif-options
lint:
  use:
    - STANDARD
    - MOTIF
breaking:
  use:
    - FILE
    - MOTIF
  # LOCAL-ONLY (mkumar/reference-parameters-on-map): the temporary package's entries-map
  # restructuring (already on the gautamp base) is breaking vs origin/main by design; the
  # local-motif-proto enable flow runs `buf breaking --against origin/main` and must pass.
  ignore:
    - proto/motif/data/temporary/v1/temporary.proto
